<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة تبادل الكتب الجامعية</title>
    
    <!-- External CSS (مربوط بملف التنسيقات الرئيسي) -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Internal CSS (مطلوب ضمن متطلبات الواجب) -->
    <style>
        .login-card {
            max-width: 420px;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu (Header & z-index) -->
    <header class="navbar">
        <div class="logo">كتب المستعملة</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="sell.html">إضافة كتاب للبيع</a></li>
                <li><a href="about.html">عن الموقع</a></li>
                <li><a href="login.html" class="active">تسجيل الدخول</a></li>
                <li><a href="signup.html">إنشاء حساب</a></li>
            </ul>
        </nav>
    </header>

   

    <!-- Main Content Area -->
    <main class="container">
        <section class="login-card">
            
            <!-- Inline CSS Demo -->
            <h2 style="color: #2c3e50; text-align: center; margin-bottom: 8px;">تسجيل الدخول</h2>
            <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 25px;">أدخل بيانات حسابك الجامعي للوصول إلى المنصة</p>

            <!-- Login Form -->
            <form action="#" method="post">
                
                <!-- البريد الجامعي -->
                <div class="form-group">
                    <label for="userEmail">البريد الإلكتروني الجامعي <span class="required">*</span></label>
                    <input type="email" id="userEmail" name="userEmail" required placeholder="example@kau.edu.sa">
                </div>

                <!-- كلمة المرور -->
                <div class="form-group">
                    <label for="userPassword">كلمة المرور <span class="required">*</span></label>
                    <input type="password" id="userPassword" name="userPassword" required placeholder="••••••••">
                </div>

                <!-- خيار تذكرني -->
                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="rememberMe" name="rememberMe" style="width: auto;">
                    <label for="rememberMe" style="font-weight: normal; margin: 0;">تذكر بياناتي على هذا الجهاز</label>
                </div>

                <!-- زر تسجيل الدخول -->
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; padding: 12px;">دخول</button>

                <!-- رابط الانتقال لصفحة إنشاء حساب -->
                <div class="form-footer">
                    <p>ليس لديك حساب بعد؟ <a href="signup.html" style="color: #16a085; font-weight: bold; text-decoration: none;">إنشاء حساب جديد</a></p>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p style="text-align: center; padding: 20px; color: #777; font-size: 14px;">&copy; 2026 جميع الحقوق محفوظة - مشروع CPIS 358</p>
    </footer>

</body>
</html>
