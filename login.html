<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة تبادل الكتب الجامعية</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-card {
            max-width: 420px;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .form-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .banner {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>

    <script>
        function highlightBanner() {
            var bannerImg = document.getElementById("loginBannerImg");
            var bannerText = document.getElementById("dynamicBannerText");
            bannerImg.style.border = "3px solid #16a085";
            bannerImg.style.borderRadius = "10px";
            bannerText.innerHTML = "أهلاً بك في بوابة طلاب جامعة الملك عبدالعزيز لتبادل الكتب";
            bannerText.style.color = "#16a085";
        }

        function resetBanner() {
            var bannerImg = document.getElementById("loginBannerImg");
            var bannerText = document.getElementById("dynamicBannerText");
            bannerImg.style.border = "none";
            bannerText.innerHTML = "منصة تبادل الكتب الجامعية المستعملة";
            bannerText.style.color = "#2c3e50";
        }

        function showEmailHint() {
            var hint = document.getElementById("emailHint");
            hint.style.display = "block";
            hint.innerHTML = "يرجى استخدام بريدك الجامعي الرسمي (مثال: name@kau.edu.sa)";
        }

        function hideEmailHint() {
            var hint = document.getElementById("emailHint");
            hint.style.display = "none";
        }
        function validateLoginForm() {
    var email = document.getElementById("userEmail").value;
    var password = document.getElementById("userPassword").value;
    var remember = document.getElementById("rememberMe").checked;
    var loginMsg = document.getElementById("loginErrorMsg");

    loginMsg.style.display = "block";
    loginMsg.style.padding = "10px";
    loginMsg.style.borderRadius = "5px";
    loginMsg.style.marginBottom = "15px";

    if (email == "" || email.indexOf("@") == -1 || email.indexOf(".") == -1) {
        loginMsg.style.color = "#b91c1c";
        loginMsg.style.backgroundColor = "#fee2e2";
        loginMsg.innerHTML = "خطأ: يرجى إدخال بريد إلكتروني صحيح.";
        document.getElementById("userEmail").style.borderColor = "red";
        return false;
    } else {
        document.getElementById("userEmail").style.borderColor = "#ccc";
    }

    if (password == "" || password.length < 6) {
        loginMsg.style.color = "#b91c1c";
        loginMsg.style.backgroundColor = "#fee2e2";
        loginMsg.innerHTML = "خطأ: كلمة المرور يجب أن تكون 6 خانات على الأقل.";
        document.getElementById("userPassword").style.borderColor = "red";
        return false;
    } else {
        document.getElementById("userPassword").style.borderColor = "#ccc";
    }

    loginMsg.style.color = "#065f46";
    loginMsg.style.backgroundColor = "#d1fae5";

    if (remember == true) {
        loginMsg.innerHTML = "تم تسجيل الدخول بنجاح! سيتم تذكر بياناتك على هذا الجهاز.";
    } else {
        loginMsg.innerHTML = "تم تسجيل الدخول بنجاح! مرحباً بك في المنصة.";
    }

    return false;
}
    </script>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <a href="about.html">
                <img src="images/logo.png" alt="شعار منصة تبادل الكتب الجامعية" width="44" height="44">
                <span>كتب المستعملة</span>
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="sell.html">إضافة كتاب للبيع</a></li>
                <li><a href="about.html">عن الموقع</a></li>
                <li><a href="login.html" class="active">تسجيل الدخول</a></li>
                <li><a href="signup.html">إنشاء حساب</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">

        <div class="banner">
            <a href="about.html">
                <img id="loginBannerImg" src="images/banner.jpg" alt="منصة تبادل الكتب الجامعية - عن المنصة" width="900" height="300" onmouseover="highlightBanner()" onmouseout="resetBanner()">
            </a>
            <p id="dynamicBannerText" style="font-weight: bold; color: #2c3e50; margin-top: 10px;">منصة تبادل الكتب الجامعية المستعملة</p>
        </div>

        <section class="login-card">

            <h2 style="color: #2c3e50; text-align: center; margin-bottom: 8px;">تسجيل الدخول</h2>
            <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 25px;">أدخل بيانات حسابك الجامعي
                للوصول إلى المنصة</p>

            <div id="loginErrorMsg" style="display: none;"></div>

            <form action="#" method="post" onsubmit="return validateLoginForm()">

                <div class="form-group">
                    <label for="userEmail">البريد الإلكتروني الجامعي <span class="required">*</span></label>
                    <input type="text" id="userEmail" name="userEmail" placeholder="example@kau.edu.sa" onfocus="showEmailHint()" onblur="hideEmailHint()">
                    <p id="emailHint" style="display: none; font-size: 12px; color: #0f766e; margin-top: 5px;"></p>
                </div>

                <div class="form-group">
                    <label for="userPassword">كلمة المرور <span class="required">*</span></label>
                    <input type="password" id="userPassword" name="userPassword" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe" style="width: auto;">
                    <label for="rememberMe" style="display: inline; font-weight: normal; margin: 0;">تذكر بياناتي على
                        هذا الجهاز</label>
                </div>

                <button type="submit" class="btn-primary"
                    style="width: 100%; margin-top: 10px; padding: 12px;">دخول</button>

                <div class="form-footer">
                    <p>ليس لديك حساب بعد؟ <a href="signup.html"
                            style="color: #16a085; font-weight: bold; text-decoration: none;">إنشاء حساب جديد</a></p>
                </div>

            </form>
        </section>
    </div>

    <footer>
        <p style="text-align: center; padding: 20px; color: #777; font-size: 14px;">&copy; 2026 جميع الحقوق محفوظة -
            مشروع CPIS 358</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
